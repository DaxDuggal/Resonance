name: Build Resonance

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.0

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            platform: windows
            export-preset: Windows Desktop
            export-path: build/windows/Resonance.exe
            export-folder: build/windows
            package-path: dist/Resonance-Windows.zip

          - name: Linux
            os: ubuntu-22.04
            platform: linux
            export-preset: Linux
            export-path: build/linux/Resonance.x86_64
            export-folder: build/linux
            package-path: dist/Resonance-Linux.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Import Godot project
        shell: bash
        run: godot --headless --import

      - name: Export project
        shell: bash
        run: |
          mkdir -p "$(dirname "${{ matrix.export-path }}")"
          godot --headless \
            --export-release "${{ matrix.export-preset }}" \
            "${{ matrix.export-path }}"

      - name: Package Windows build
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Compress-Archive `
            -Path "${{ matrix.export-folder }}/*" `
            -DestinationPath "${{ matrix.package-path }}" `
            -Force

      - name: Package Linux build
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "${{ matrix.package-path }}" \
            -C "${{ matrix.export-folder }}" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Resonance-${{ matrix.name }}
          path: ${{ matrix.package-path }}
          if-no-files-found: error

name: Build Resonance

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.0

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            platform: windows
            export-preset: Windows Desktop
            export-path: build/windows/Resonance.exe
            export-folder: build/windows

          - name: Linux
            os: ubuntu-22.04
            platform: linux
            export-preset: Linux
            export-path: build/linux/Resonance.x86_64
            export-folder: build/linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Import Godot project
        shell: bash
        run: godot --headless --import

      - name: Export project
        shell: bash
        run: |
          mkdir -p "$(dirname "${{ matrix.export-path }}")"
          godot --headless \
            --export-release "${{ matrix.export-preset }}" \
            "${{ matrix.export-path }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Resonance-${{ matrix.name }}
          path: ${{ matrix.export-folder }}
          if-no-files-found: error
